[project]
name = "job-source-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",          # ScrapingDog calls
    "playwright>=1.47",     # renders company sites; static fetching was not enough
    "anthropic>=0.40",      # Haiku, used only to choose a link
    "fastapi>=0.115",       # the deployed demo Jobnova tests against
    "uvicorn>=0.32",
    "python-dotenv>=1.0",   # SCRAPINGDOG_API_KEY out of .env
]

# Installs this repo as a real package (editable), so `from job_source_agent...`
# works from any file or folder instead of relying on relative paths.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling looks for packages at the repo root by default; ours live under src/.
[tool.hatch.build.targets.wheel]
packages = ["src/job_source_agent"]
